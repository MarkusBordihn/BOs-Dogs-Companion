tasks.register('extractHytaleApi') {
  group = 'hytale'
  description = 'Extracts Hytale API class files to temporary directory for decompilation'

  def hytaleJar = file(project.findProperty('hytaleServerJar') ?: 'HytaleServer.jar')
  def outputDir = file("$buildDir/tmp/hytale-classes")

  inputs.file(hytaleJar)
  outputs.dir(outputDir)

  doLast {
    if (!hytaleJar.exists()) {
      throw new GradleException("HytaleServer.jar not found at: ${hytaleJar}")
    }

    delete outputDir
    outputDir.mkdirs()

    println "Extracting class files from ${hytaleJar.name}..."

    copy {
      from zipTree(hytaleJar)
      into outputDir
      include 'com/hypixel/hytale/**/*.class'
    }

    def classCount = 0
    outputDir.eachFileRecurse { file ->
      if (file.name.endsWith('.class')) {
        classCount++
      }
    }

    println "✅ Extracted ${classCount} class files to temporary directory"
  }
}

def vineflowerConfig = configurations.create('vineflower') {
  visible = false
  transitive = true
}

dependencies {
  vineflower 'org.vineflower:vineflower:1.11.1'
  vineflower 'org.benf:cfr:0.152'
}

tasks.register('runVineflower', JavaExec) {
  group = 'hytale'
  description = 'Runs Vineflower decompiler on extracted Hytale API classes (pass 1 - bulk)'

  def classesDir = file("$buildDir/tmp/hytale-classes")
  def outputDir = file("$projectDir/hytale-api")

  mainClass = 'org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler'
  classpath = vineflowerConfig

  jvmArgs = ['-Xmx4G', '-Xss128M', '-XX:+UseParallelGC', '-XX:MaxMetaspaceSize=512M']

  def threadCount = Math.max(4, Runtime.runtime.availableProcessors())

  args = [
      '-dgs=1', '-hdc=0', '-asc=1', '-rsy=1', '-lit=1', '-nns=1',
      '-mpm=120',
      "-thr=${threadCount}",
      '-iec=1',
      '-log=ERROR',
      classesDir.absolutePath,
      outputDir.absolutePath
  ]

  ignoreExitValue = true

  doFirst {
    delete outputDir
    outputDir.mkdirs()
    println "═══════════════════════════════════════════════════════════════"
    println "Pass 1: Decompilation with generic signatures enabled"
    println "   Heap: 4G | Stack: 128M | Threads: ${threadCount} | Timeout: 120s/method"
    println "═══════════════════════════════════════════════════════════════"
  }
}

tasks.register('retryFailedDecompilation') {
  group = 'hytale'
  description = 'Retries failed classes using CFR decompiler as fallback (pass 2)'

  def classesDir = file("$buildDir/tmp/hytale-classes")
  def outputDir = file("$projectDir/hytale-api")

  dependsOn runVineflower

  doLast {
    // Vineflower silently skips failed classes, detect them by comparing input vs output
    def nestedOutputDir = new File(outputDir, classesDir.name)
    def effectiveOutputDir = nestedOutputDir.exists() ? nestedOutputDir : outputDir

    def decompiledClasses = [] as Set
    effectiveOutputDir.eachFileRecurse { file ->
      if (file.name.endsWith('.java')) {
        def relativePath = file.absolutePath
            .replace(effectiveOutputDir.absolutePath + File.separator, '')
            .replace('.java', '.class')
        decompiledClasses << relativePath
      }
    }

    def failedClassPaths = []
    classesDir.eachFileRecurse { file ->
      if (file.name.endsWith('.class')) {
        def relativePath = file.absolutePath
            .replace(classesDir.absolutePath + File.separator, '')
        if (!decompiledClasses.contains(relativePath)) {
          failedClassPaths << relativePath
        }
      }
    }

    if (failedClassPaths.isEmpty()) {
      println "✅ No failed classes to retry!"
      return
    }

    println ""
    println "═══════════════════════════════════════════════════════════════"
    println "Pass 2: Retrying ${failedClassPaths.size()} failed classes with CFR"
    println "   CFR uses a different decompilation engine than Vineflower"
    println "═══════════════════════════════════════════════════════════════"

    def cfrJar = vineflowerConfig.resolve().find { it.name.contains('cfr') }
    if (!cfrJar) {
      println "⚠️  CFR jar not found, skipping pass 2"
      return
    }

    def javaBin = "${System.getProperty('java.home')}${File.separator}bin${File.separator}java"
    def recoveredCount = new java.util.concurrent.atomic.AtomicInteger(0)
    def stillFailedCount = new java.util.concurrent.atomic.AtomicInteger(0)
    def processedCount = new java.util.concurrent.atomic.AtomicInteger(0)
    def totalFailed = failedClassPaths.size()
    def startTime = System.currentTimeMillis()
    def threadCount = Math.max(4, Runtime.runtime.availableProcessors())

    println "   Using ${threadCount} parallel threads"

    def executor = java.util.concurrent.Executors.newFixedThreadPool(threadCount)
    def activeProcesses = java.util.Collections.synchronizedList([])
    def futures = []

    def shutdownHook = new Thread({
      println "\n⚠️  Interrupted - shutting down CFR processes..."
      executor.shutdownNow()
      activeProcesses.each { proc ->
        try { proc.destroyForcibly() } catch (Exception ignored) {}
      }
    })
    Runtime.runtime.addShutdownHook(shutdownHook)

    try {
      failedClassPaths.each { relativePath ->
        futures << executor.submit({
          if (Thread.currentThread().isInterrupted()) return

          def classFile = new File(classesDir, relativePath)
          def javaRelativePath = relativePath.replace('.class', '.java')
          def targetJavaFile = new File(effectiveOutputDir, javaRelativePath)

          try {
            def cmd = ([
                javaBin, '-Xmx512M', '-Xss8M',
                '-jar', cfrJar.absolutePath,
                classFile.absolutePath,
                '--extraclasspath', classesDir.absolutePath,
                '--silent', 'true'
            ] as List).collect { it.toString() }

            def process = new ProcessBuilder(cmd).redirectErrorStream(true).start()
            activeProcesses << process
            def output = new StringBuilder()
            process.inputStream.eachLine { line -> output.append(line).append('\n') }
            def exitCode = process.waitFor()
            activeProcesses.remove(process)

            if (Thread.currentThread().isInterrupted()) return

            if (exitCode == 0 && output.length() > 50) {
              targetJavaFile.parentFile.mkdirs()
              targetJavaFile.text = output.toString()
              recoveredCount.incrementAndGet()
            } else {
              stillFailedCount.incrementAndGet()
            }
          } catch (InterruptedException ie) {
            Thread.currentThread().interrupt()
          } catch (Exception e) {
            stillFailedCount.incrementAndGet()
          }

          def current = processedCount.incrementAndGet()
          if (current % 100 == 0 || current == totalFailed) {
            def pct = Math.min(100, (int) (current * 100 / totalFailed))
            def elapsed = (System.currentTimeMillis() - startTime) / 1000
            def barLen = 30
            def filled = Math.min(barLen, (int) (barLen * current / totalFailed))
            def empty = Math.max(0, barLen - filled)
            def bar = ('\u2588' * filled) + ('\u2591' * empty)
            println "   [${bar}] ${pct}% (${current}/${totalFailed}) ${(int) elapsed}s | recovered: ${recoveredCount.get()}"
          }
        } as Runnable)
      }

      futures.each { it.get() }
    } catch (Exception e) {
      println "\n⚠️  Pass 2 interrupted - cleaning up..."
      futures.each { future ->
        try { future.cancel(true) } catch (Exception ignored) {}
      }
      activeProcesses.each { proc ->
        try { proc.destroyForcibly() } catch (Exception ignored) {}
      }
    } finally {
      executor.shutdownNow()
      executor.awaitTermination(5, java.util.concurrent.TimeUnit.SECONDS)
      activeProcesses.each { proc ->
        try { proc.destroyForcibly() } catch (Exception ignored) {}
      }
      try { Runtime.runtime.removeShutdownHook(shutdownHook) } catch (Exception ignored) {}
    }

    println ""
    println "Pass 2 Results (CFR):"
    println "   \u2705 Recovered: ${recoveredCount.get()} classes"
    if (stillFailedCount.get() > 0) {
      println "   \u26a0\ufe0f  Still failed: ${stillFailedCount.get()} classes (kept as .class)"
    }
  }
}

tasks.register('decompileHytaleApi') {
  group = 'hytale'
  description = 'Decompiles extracted Hytale API class files to Java sources (2-pass with retry)'

  dependsOn extractHytaleApi, retryFailedDecompilation

  def classesDir = file("$buildDir/tmp/hytale-classes")
  def outputDir = file("$projectDir/hytale-api")

  doLast {
    def decompDir = new File(outputDir, classesDir.name)
    if (decompDir.exists()) {
      copy {
        from decompDir
        into outputDir
      }
      delete decompDir
    }

    def javaFiles = []
    def classFiles = []
    def totalClasses = 0
    classesDir.eachFileRecurse { file ->
      if (file.name.endsWith('.class')) {
        totalClasses++
      }
    }

    def decompiledSet = [] as Set
    outputDir.eachFileRecurse { file ->
      if (file.name.endsWith('.java')) {
        def relativePath = file.absolutePath
            .replace(outputDir.absolutePath + File.separator, '')
            .replace('.java', '.class')
        decompiledSet << relativePath
      }
    }

    def copiedClassCount = 0
    classesDir.eachFileRecurse { file ->
      if (file.name.endsWith('.class')) {
        def relativePath = file.absolutePath
            .replace(classesDir.absolutePath + File.separator, '')
        if (!decompiledSet.contains(relativePath)) {
          def targetFile = new File(outputDir, relativePath)
          targetFile.parentFile.mkdirs()
          java.nio.file.Files.copy(file.toPath(), targetFile.toPath(),
              java.nio.file.StandardCopyOption.REPLACE_EXISTING)
          copiedClassCount++
        }
      }
    }

    if (copiedClassCount > 0) {
      println "📦 Copied ${copiedClassCount} non-decompiled .class files to output"
    }

    outputDir.eachFileRecurse { file ->
      if (file.name.endsWith('.java')) {
        def className = file.absolutePath
            .replace(outputDir.absolutePath + File.separator, '')
            .replace(File.separator, '.')
            .replace('.java', '')
        javaFiles << className
      } else if (file.name.endsWith('.class')) {
        def className = file.absolutePath
            .replace(outputDir.absolutePath + File.separator, '')
            .replace(File.separator, '.')
            .replace('.class', '')
        classFiles << className
      }
    }

    def indexFile = new File(outputDir, 'API_INDEX.txt')
    def sortedFiles = javaFiles.sort()
    def grouped = [:]
    sortedFiles.each { className ->
      def pkg = className.substring(0, className.lastIndexOf('.'))
      if (!grouped.containsKey(pkg)) {
        grouped[pkg] = []
      }
      grouped[pkg] << className.substring(className.lastIndexOf('.') + 1)
    }

    def successRate = totalClasses > 0 ? (javaFiles.size() * 100.0 / totalClasses) : 0

    indexFile.text = "Hytale API - Decompiled Sources\n"
    indexFile.text += "=" * 80 + "\n"
    indexFile.text += "Decompiled with Vineflower on ${new Date().format('yyyy-MM-dd HH:mm:ss')}\n"
    indexFile.text += "=" * 80 + "\n"
    indexFile.text += "\nDecompilation Statistics:\n"
    indexFile.text += "  Total classes:      ${totalClasses}\n"
    indexFile.text += "  Successfully decompiled: ${javaFiles.size()}\n"
    indexFile.text += "  Failed to decompile:     ${totalClasses - javaFiles.size()}\n"
    indexFile.text += "  Success rate:            ${String.format('%.2f', successRate)}%\n"

    if (classFiles.size() > 0) {
      indexFile.text += "\nNote: ${classFiles.size()} classes remain as .class files due to decompilation failures.\n"
      indexFile.text += "These are typically complex/obfuscated classes that caused StackOverflowError.\n"
      indexFile.text += "You can still reference them via IDE decompiler or use them for compilation.\n"
    }

    indexFile.text += "\n" + "=" * 80 + "\n"
    indexFile.text += "\nDecompiled Classes by Package:\n"
    indexFile.text += "=" * 80 + "\n"

    grouped.each { pkg, classList ->
      indexFile.text += "\n${pkg}:\n"
      classList.each { cls ->
        indexFile.text += "  - ${cls}\n"
      }
    }

    if (classFiles.size() > 0) {
      indexFile.text += "\n" + "=" * 80 + "\n"
      indexFile.text += "\nFailed Decompilations (available as .class):\n"
      indexFile.text += "=" * 80 + "\n"
      classFiles.sort().each { className ->
        indexFile.text += "  - ${className}\n"
      }
    }

    println "✅ Decompilation complete!"
    println "   Successfully decompiled: ${javaFiles.size()} classes"
    if (totalClasses - javaFiles.size() > 0) {
      println "   ⚠️  Failed to decompile: ${totalClasses - javaFiles.size()} classes (kept as .class)"
      println "   These classes had StackOverflowError or other decompilation issues"
    }
    println "   Success rate: ${String.format('%.2f', successRate)}%"
    println "📁 Output: ${outputDir}"
    println "📄 Index: ${indexFile}"

    println "🧹 Cleaning up temporary class files..."
    delete classesDir
    println "✅ Temporary class files removed"
  }
}

tasks.register('extractHytaleResources') {
  group = 'hytale'
  description = 'Extracts Hytale Assets to hytale-resources/ for reference'

  def assetsZip = file(getHytaleAssetsPath())
  def outputDir = file("$projectDir/hytale-resources")

  doLast {
    if (!assetsZip.exists()) {
      throw new GradleException("Hytale Assets.zip not found at: ${assetsZip}")
    }

    delete outputDir
    outputDir.mkdirs()

    println "Extracting from ${assetsZip.name}..."

    copy {
      from zipTree(assetsZip)
      into outputDir
    }

    def fileCount = 0
    outputDir.eachFileRecurse { file ->
      if (file.isFile()) {
        fileCount++
      }
    }

    println "✅ Extracted ${fileCount} Hytale resource files"
    println "📁 Output: ${outputDir}"
  }

}

tasks.register('decompile') {
  group = 'hytale'
  description = 'Decompile Hytale developer resources for reference (requires valid Hytale license)'

  doFirst {
    logger.warn("")
    logger.warn("=" * 80)
    logger.warn("IMPORTANT NOTICE: Decompilation is for development purposes only!")
    logger.warn("- Requires a valid Hytale installation and license")
    logger.warn("- Decompiled code is NOT redistributable")
    logger.warn("- Only for API reference during plugin development")
    logger.warn("- Output files are excluded from version control (.gitignore)")
    logger.warn("=" * 80)
    logger.warn("")
  }

  dependsOn decompileHytaleApi, extractHytaleResources

  doLast {
    println "\n✅ Hytale extraction complete!"
    println "   - Decompiled API sources available in hytale-api/"
    println "   - Resources available in hytale-resources/"
    println "\n⚠️  Remember: These files are for development reference only."
    println "   Do not redistribute or commit them to version control."
  }
}
