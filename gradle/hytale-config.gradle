ext {
  getHytalePath = { String subPath ->
    def home = project.findProperty('hytaleHome') ?: 'G:/Hytale/install/release'
    def patch = project.findProperty('patchline') ?: 'package/game/latest'
    return "${home}/${patch}/${subPath}"
  }

  getHytaleAssetsPath = {
    return getHytalePath('Assets.zip')
  }

  getHytaleServerJar = {
    return project.findProperty('hytaleServerJar') ?: 'HytaleServer.jar'
  }
}

tasks.register('verifyHytaleInstallation') {
  group = 'verification'
  description = 'Verifies that Hytale installation paths are correct'

  doLast {
    def serverJar = file(getHytaleServerJar())
    def assetsZip = file(getHytaleAssetsPath())

    println "Checking Hytale installation..."
    println "Server JAR: ${serverJar.absolutePath}"
    println "  Exists: ${serverJar.exists()}"
    println "Assets ZIP: ${assetsZip.absolutePath}"
    println "  Exists: ${assetsZip.exists()}"

    if (!serverJar.exists()) {
      logger.warn("Hytale Server JAR not found. Please configure 'hytaleServerJar' in gradle.properties")
    }
    if (!assetsZip.exists()) {
      logger.warn("Hytale Assets not found. Please configure 'hytaleHome' and 'patchline' in gradle.properties")
    }
  }
}
