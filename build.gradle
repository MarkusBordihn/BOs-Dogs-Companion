buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'com.guardsquare:proguard-gradle:7.8.2'
  }
}

plugins {
  id 'java'
  id 'maven-publish'
  id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

// Apply external configuration
apply from: 'gradle/hytale-config.gradle'
apply from: 'gradle/hytale-tasks.gradle'

group = project.group
version = project.version

base {
  archivesName = "${project.mod_id}-hytale-${project.version}"
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
  withSourcesJar()
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation platform('org.junit:junit-bom:5.10.0')
  testImplementation 'org.junit.jupiter:junit-jupiter'

  // Hytale Server dependency
  compileOnly files(project.findProperty('hytaleServerJar') ?: 'HytaleServer.jar')
}

if (!file("$projectDir/run").exists()) {
  file("$projectDir/run").mkdirs()
}

tasks.register('proguard', proguard.gradle.ProGuardTask) {
  dependsOn tasks.jar

  // Input JAR
  injars(tasks.named('jar', Jar).flatMap { it.archiveFile })

  // Output JAR
  outjars(layout.buildDirectory.file("libs/${project.mod_id}-hytale-${project.version}-minified.jar"))

  // Library JARs - Java runtime and Hytale Server
  libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
  libraryjars "${System.getProperty('java.home')}/jmods/java.logging.jmod", jarfilter: '!**.jar', filter: '!module-info.class'

  // Hytale Server JAR
  def hytaleJar = file(project.findProperty('hytaleServerJar') ?: 'HytaleServer.jar')
  if (hytaleJar.exists()) {
    libraryjars hytaleJar
  }

  // ProGuard configuration - Maximum obfuscation with precise keeps
  dontoptimize()

  // Keep only essential runtime attributes
  keepattributes 'Signature,Exceptions,*Annotation*'
  keepattributes 'Manifest'

  // Keep main plugin class and components/systems
  keep 'public class de.markusbordihn.dogscompanion.DogsCompanion extends com.hypixel.hytale.server.core.plugin.JavaPlugin { public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.component.DogOwnerComponent { public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.component.DogStateComponent { public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.component.DogNameComponent { public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.component.DogTamingProgressComponent { public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.systems.DogOffenseSystem { public <init>(...); }'
  keep 'public class de.markusbordihn.dogscompanion.systems.DogDefenseSystem { public <init>(...); }'
  keep 'public class de.markusbordihn.dogscompanion.systems.DogCombatDamageSystem { public <init>(...); }'
  keep 'public class de.markusbordihn.dogscompanion.manager.DogsManager { public <init>(...); }'
  keep 'public class de.markusbordihn.dogscompanion.manager.DogsNamesManager { public protected *; }'

  // Keep resource classes
  keep 'public class de.markusbordihn.dogscompanion.world.storage.DogsCompanionDataResource { public protected *; }'

  // Keep data classes and enums
  keep 'public enum de.markusbordihn.dogscompanion.data.DogState { *; }'
  keep 'public enum de.markusbordihn.dogscompanion.data.DogStatus { *; }'
  keep 'public enum de.markusbordihn.dogscompanion.data.DogType { *; }'

  // Keep data records (records are final classes that extend java.lang.Record)
  keep 'public final class de.markusbordihn.dogscompanion.data.DogDataEntry { public protected *; }'
  keep 'public final class de.markusbordihn.dogscompanion.data.DogOwnerData { public protected *; }'
  keep 'public final class de.markusbordihn.dogscompanion.data.DogStateData { public protected *; }'

  // Keep Action builders (registered via reflection in Main.java)
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogInteractionWild { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogInteractionWild$ActionDogInteractionWild { public <init>(...); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogInteractionOwner { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogInteractionOwner$ActionDogInteractionOwner { public <init>(...); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogInteractionStranger { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogInteractionStranger$ActionDogInteractionStranger { public <init>(...); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogCycleState { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogCycleState$ActionDogCycleState { public <init>(...); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogReturnToPreviousState { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.actions.BuilderActionDogReturnToPreviousState$ActionDogReturnToPreviousState { public <init>(...); public protected *; }'
  keep 'public abstract class de.markusbordihn.dogscompanion.actions.BuilderActionDogInteractionBase { public protected *; }'
  keep 'public abstract class de.markusbordihn.dogscompanion.actions.BuilderActionDogInteractionBase$ActionDogInteractionBase { public <init>(...); public protected *; }'

  // Keep Sensor builders (registered via reflection in Main.java)
  keep 'public class de.markusbordihn.dogscompanion.sensors.BuilderSensorIsDogTamed { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.sensors.BuilderSensorIsDogTamed$SensorIsDogTamed { public <init>(...); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.sensors.BuilderSensorIsOwner { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.sensors.BuilderSensorIsOwner$SensorIsOwner { public <init>(...); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.sensors.BuilderSensorOwnerAttacked { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.dogscompanion.sensors.BuilderSensorOwnerAttacked$SensorOwnerAttacked { public <init>(...); public protected *; }'

  // Keep enum structure
  keepclassmembers 'enum * { public static **[] values(); public static ** valueOf(java.lang.String); }'

  // Keep all command classes (used by Hytale Command System)
  keep 'public class de.markusbordihn.dogscompanion.commands.DogCommands extends com.hypixel.hytale.server.core.command.system.basecommands.** { public protected *; }'
  keep 'public abstract class de.markusbordihn.dogscompanion.commands.DogCommand extends com.hypixel.hytale.server.core.command.system.basecommands.** { public protected *; }'
  keep 'class de.markusbordihn.dogscompanion.commands.*Command extends de.markusbordihn.dogscompanion.commands.DogCommand { public protected *; }'

  // Don't print notes about potential issues
  dontnote

  // Don't warn about Hytale runtime dependencies
  dontwarn 'com.hypixel.hytale.**'
  dontwarn 'javax.annotation.**'

  verbose
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.incremental = true
  options.fork = true
  options.forkOptions.memoryMaximumSize = '2g'
}

test {
  useJUnitPlatform()
}

jar {
  manifest {
    attributes([
        'Specification-Title'   : project.mod_name,
        'Specification-Vendor'  : project.vendor_name,
        'Specification-Version' : project.version,
        'Implementation-Title'  : project.mod_name,
        'Implementation-Version': project.version,
        'Implementation-Vendor' : project.vendor_name,
    ])
  }
}

// IntelliJ IDEA run configuration
def serverRunDir = file("$projectDir/run")

// IntelliJ run configuration using Application (not Gradle task)
idea {
  project {
    settings {
      runConfigurations {
        'HytaleServer'(org.jetbrains.gradle.ext.Application) {
          mainClass = 'com.hypixel.hytale.Main'
          moduleName = rootProject.name + '.main'

          def hytaleHome = project.findProperty('hytaleHome') ?: 'G:/Hytale/install/release'
          def patchline = project.findProperty('patchline') ?: 'package/game/latest'
          def assetsPath = "${hytaleHome}/${patchline}/Assets.zip"
          def modsPath = file("src/main/").absolutePath

          programParameters = "--allow-op --assets=\"${assetsPath}\" --mods=\"${modsPath}\""
          workingDirectory = serverRunDir.absolutePath

          shortenCommandLine = 'MANIFEST'
        }
      }
    }
  }
}
